name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run automated tests
        run: |
          mkdir -p actual_output
          failed=0

          for test_in in tests/*.in; do
            test_name=$(basename "$test_in" .in)
            expected_out="tests/${test_name}.out"
            actual_out="actual_output/${test_name}.out"

            # Execute Python script with input redirection
            python elevator.py < "$test_in" > "$actual_out"

            if ! diff -u "$actual_out" "$expected_out"; then
              echo "Test failed: $test_name"
              failed=1
            else
              echo "Test passed: $test_name"
            fi
          done

          exit $failed
